[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elielsito"
version = "0.2.0"
description = "Asistente personal de IA modular, con memoria y herramientas controladas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
elielsito = "elielsito.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["elielsito*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
